services:
  unit:
    build: .
    working_dir: /app
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - type: bind
        source: ./
        target: /app
        read_only: false
      - vendor_data:/app/vendor
      - phpunit_cache:/app/.phpunit.cache
    command: >-
      sh -lc "composer install --no-interaction --prefer-dist && vendor/bin/phpunit --testsuite=Unit"
    tty: true
    stdin_open: true

  integration:
    profiles:
      - integration
    build: .
    working_dir: /app
    env_file:
      - .env
    environment:
      VERIFACTU_CERT_PATH: /certs/cert.p12
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - type: bind
        source: ./
        target: /app
        read_only: false
      - type: bind
        source: ${VERIFACTU_CERT_PATH:?Set VERIFACTU_CERT_PATH in .env}
        target: /certs/cert.p12
        read_only: true
        bind:
          create_host_path: false
      - vendor_data:/app/vendor
      - phpunit_cache:/app/.phpunit.cache
    command: >-
      sh -lc "composer install --no-interaction --prefer-dist && vendor/bin/phpunit --testsuite=Integration"
    tty: true
    stdin_open: true

volumes:
  vendor_data:
  phpunit_cache:
